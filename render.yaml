services:
  # ─────────────────────────────────────────────
  # Backend — json-server Web Service
  # URL: https://musicmart-backend-htci.onrender.com
  # ─────────────────────────────────────────────
  - type: web
    name: Musicmart--backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000

  # ─────────────────────────────────────────────
  # Frontend — React/Vite served via Node (SPA)
  # URL: https://musicmart-4pzd.onrender.com
  # ─────────────────────────────────────────────
  - type: web
    name: Musicmart-
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run serve
    envVars:
      - key: VITE_API_URL
        value: https://musicmart-backend-htci.onrender.com
      - key: PORT
        value: 10000
